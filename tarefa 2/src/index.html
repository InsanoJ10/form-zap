<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <main>
        <div class="1">
            <h2>Empresa</h2>
        </div>
        <div class="2">
            <h3>Olá! insira seus dados para ser derecionado para o WhatsApp</h3>
        </div>
        <div class="3">
            <h3>Seu nome</h3>
            <input type="text" name="nome" id="nome" placeholder="Digite seu nome" required>
            <h3>Seu e-mail</h3>
            <input type="email" name="e-mail" id="email" placeholder="Digite seu e-mail" required>
            <h3>Seu WhatsApp</h3>
            <input type="number" name="number" id="number" placeholder="+55 (00) 00000-0000" required>
        </div>
        <div>
            <a href="https://web.whatsapp.com"><button>Ir para o WhatsApp</button></a>
        </div>
        <script src="script.js"></script>
    </main>
    
</body>
</html>
